name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mock-mode pipeline smoke test (no API keys required)
        run: python main.py --company Tesla

      - name: API test suite (mock mode)
        run: pytest tests/ -v
